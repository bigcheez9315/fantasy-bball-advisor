[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-bball-advisor"
version = "0.1.0"
description = "Yahoo 9-category fantasy basketball waiver wire and lineup advisor"
requires-python = ">=3.10"
dependencies = [
    "yahoo_fantasy_api>=2.12",
    "yahoo-oauth>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "rich>=13.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fantasy = "fantasy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
